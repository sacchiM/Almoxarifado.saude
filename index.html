        function authenticateUser(loginInput, passwordInput) {
            const cleanLogin = loginInput.trim().toLowerCase();
            const user = DB.users.find(u => u.login === cleanLogin && u.active);

            if (!user) {
                showToast('Acesso Negado: Login incorreto ou usuário inativo. Utilize o formato nome.cargo', 'danger');
                return false;
            }

            if (!passwordInput || passwordInput.length < 3) {
                showToast('Informe uma senha válida para prosseguir.', 'warning');
                return false;
            }

            // Authenticate successfully
            AppState.currentUser = user;
            AppState.currentTab = 'dashboard';
            
            // Log security audit
            addAuditLog(user.name, getRoleLabel(user.role), 'Login no Sistema', `Autenticação bem sucedida com o login ${user.login}`, 'Segurança');

            renderApp();
            showToast(`Bem-vindo(a), ${user.name.split(' ')[0]}! Sessão iniciada com sucesso.`, 'success');
            return true;
        }

                () => {
                    AppState.currentUser = null;
                    renderApp();
                    showToast('Sessão encerrada com segurança.', 'info');
                }
            );

        function getRoleLabel(role) {
            switch(role) {
                case 'administradora': return 'Administradora';
                case 'coordenadora': return 'Coordenadora do Almoxarifado';
                case 'organizacao': return 'Responsável pela Organização';
                case 'pedidos': return 'Responsável pela Análise de Pedidos';
                default: return 'Funcionário';
            }
        }

        function getGreetingSubtitle(user) {
            switch(user.role) {
                case 'administradora': return 'administradora do sistema';
                case 'coordenadora': return 'coordenadora do almoxarifado';
                case 'organizacao': return 'responsável pela organização';
                case 'pedidos': return 'responsável pela análise de pedidos';
                default: return 'gestor municipal';
            }
        }

        function addAuditLog(userName, userRole, action, details, target) {
            const now = new Date();
            const dateStr = now.toLocaleDateString('pt-BR');
            const timeStr = now.toLocaleTimeString('pt-BR');

            DB.auditLogs.unshift({
                id: 'log-' + Date.now(),
                userName,
                userRole,
                action,
                details,
                date: dateStr,
                time: timeStr,
                target
            });
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-slate-800 text-white';
            let iconClass = 'fa-info-circle text-sky-400';

            if (type === 'success') {
                bgClass = 'bg-emerald-800 text-emerald-50 border border-emerald-600';
                iconClass = 'fa-check-circle text-emerald-300';
            } else if (type === 'danger') {
                bgClass = 'bg-rose-900 text-rose-50 border border-rose-700';
                iconClass = 'fa-exclamation-triangle text-rose-300';
            } else if (type === 'warning') {
                bgClass = 'bg-amber-900 text-amber-50 border border-amber-700';
                iconClass = 'fa-bell text-amber-300';
            }

            toast.className = `pointer-events-auto flex items-center gap-3 p-4 rounded-xl shadow-xl transform transition-all duration-300 translate-y-2 opacity-0 text-sm font-medium ${bgClass}`;
            toast.innerHTML = `
                <i class="fa-solid ${iconClass} text-lg"></i>
                <div class="flex-1">${message}</div>
                <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            `;

            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function showConfirmModal(title, message, confirmText, confirmBtnClass, onConfirm) {
            const container = document.getElementById('modal-container');

            content.innerHTML = `

                            <p class="mt-2 text-sm text-slate-600 leading-relaxed">${message}</p>
                        </div>
                    </div>
                </div>
                <div class="bg-slate-50 px-6 py-4 flex flex-row-reverse gap-3 rounded-b-xl border-t border-slate-100">
                    <button id="modal-btn-confirm" class="px-4 py-2 text-sm font-semibold text-white rounded-lg shadow-sm transition ${confirmBtnClass}">
                        ${confirmText}
                    </button>
                    <button id="modal-btn-cancel" class="px-4 py-2 text-sm font-semibold text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-100 transition">
                        Cancelar
                    </button>
                </div>
            `;

            container.classList.remove('hidden');

            document.getElementById('modal-btn-cancel').onclick = () => {
                container.classList.add('hidden');
            };

            document.getElementById('modal-btn-confirm').onclick = () => {
                container.classList.add('hidden');
                onConfirm();
            };
        }

        function handleLoginSubmit(event) {
            event.preventDefault();
            const loginVal = document.getElementById('input-login').value;
            const passVal = document.getElementById('input-password').value;
            authenticateUser(loginVal, passVal);
        }

        function quickFillLogin(login) {
            document.getElementById('input-login').value = login;
            document.getElementById('input-password').value = '123456';
            authenticateUser(login, '123456');
        }

                { id: 'orders', label: 'Análise de Pedidos', icon: 'fa-clipboard-check', allowedRoles: ['administradora', 'coordenadora', 'pedidos'], badge: DB.orders.filter(o => o.status === 'em_analise').length },
                { id: 'inventory', label: 'Conferência Física', icon: 'fa-list-check', allowedRoles: ['administradora', 'coordenadora', 'organizacao'], badge: DB.inventoryCycles.filter(i => i.status === 'em_andamento').length },

                        ${filteredNav.map(item => `
                            <button onclick="switchTab('${item.id}')" 
                                class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold transition ${tab === item.id ? 'bg-sky-600 text-white shadow-md shadow-sky-600/30' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}">

                    <!-- Authenticated User Profile Summary -->
                    <div class="p-4 border-t border-slate-800 bg-slate-950/40">

        function renderHeader() {
            const user = AppState.currentUser;

            return `

                                <i class="fa-solid fa-bell text-sm"></i>

                            </button>

        function switchTab(tabId) {
            AppState.currentTab = tabId;
            renderApp();
        }

        function toggleGlobalSearch() {
            AppState.isGlobalSearchOpen = !AppState.isGlobalSearchOpen;
            renderApp();
            if (AppState.isGlobalSearchOpen) {
                setTimeout(() => document.getElementById('global-search-input')?.focus(), 50);
            }
        }

        function toggleNotifications() {
            showToast('Central de Alertas: Mostrando as últimas 4 notificações do almoxarifado.', 'info');
        }

        function renderCurrentTabContent() {
            switch(AppState.currentTab) {
                case 'dashboard': return renderDashboard();
                case 'stock': return renderStockModule();
                case 'entries': return renderEntriesModule();
                case 'orders': return renderOrdersModule();
                case 'inventory': return renderInventoryModule();
                case 'movements': return renderMovementsModule();
                case 'donations': return renderDonationsModule();
                case 'health_units': return renderHealthUnitsModule();
                case 'audit': return renderAuditModule();
                default: return renderDashboard();
            }
        }

        function renderDashboard() {
            const user = AppState.currentUser;
            const totalProducts = DB.products.length;
            const lowStockCount = DB.products.filter(p => p.totalStock > 0 && p.totalStock < p.minStock).length;
            const missingStockCount = DB.products.filter(p => p.totalStock === 0).length;
            const expiredLotsCount = DB.lots.filter(l => l.status === 'vencido').length;
            const nearExpiryLotsCount = DB.lots.filter(l => l.status === 'proximo_vencimento').length;
            const pendingOrdersCount = DB.orders.filter(o => o.status === 'em_analise' || o.status === 'enviado').length;

            return `
                <div class="space-y-6">

                            <span class="px-3 py-1 bg-white/10 rounded-full text-[10px] font-bold uppercase tracking-wider backdrop-blur-sm">Visão de Operação • ${getRoleLabel(user.role)}</span>
                            <h2 class="text-xl font-extrabold mt-2">Painel de Monitoramento do Almoxarifado</h2>
                            <p class="text-xs text-sky-100 mt-1 max-w-2xl">Dados atualizados em tempo real para rastreabilidade, prevenção de desabastecimento e controle total da distribuição pública.</p>

                        </div>
                    </div>

                    <!-- Metrics Grid -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <!-- Total Products -->
                        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                            <div>
                                <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Produtos Cadastrados</div>
                                <div class="text-2xl font-black text-slate-900 mt-1">${totalProducts}</div>
                                <div class="text-[11px] text-slate-400 mt-1">Almoxarifado Central</div>
                            </div>
                            <div class="w-12 h-12 bg-sky-50 rounded-xl flex items-center justify-center text-sky-600 font-bold">
                                <i class="fa-solid fa-cubes text-xl"></i>
                            </div>
                        </div>

                        <!-- Low Stock Alert -->
                        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                            <div>
                                <div class="text-xs font-semibold text-amber-600 uppercase tracking-wider">Estoque Baixo</div>
                                <div class="text-2xl font-black text-amber-600 mt-1">${lowStockCount}</div>
                                <div class="text-[11px] text-slate-400 mt-1">Abaixo do limite mínimo</div>
                            </div>
                            <div class="w-12 h-12 bg-amber-50 rounded-xl flex items-center justify-center text-amber-600 font-bold">
                                <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                            </div>
                        </div>

                        <!-- Missing Products -->
                        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                            <div>
                                <div class="text-xs font-semibold text-rose-600 uppercase tracking-wider">Produtos em Falta</div>
                                <div class="text-2xl font-black text-rose-600 mt-1">${missingStockCount}</div>
                                <div class="text-[11px] text-slate-400 mt-1">Estoque Zerado</div>

                            <div class="w-12 h-12 bg-rose-50 rounded-xl flex items-center justify-center text-rose-600 font-bold">
                                <i class="fa-solid fa-circle-xmark text-xl"></i>

                                <div class="text-xs font-semibold text-purple-600 uppercase tracking-wider">Alerta de Validade</div>

                                <div class="text-[11px] text-slate-400 mt-1">${expiredLotsCount} vencidos • ${nearExpiryLotsCount} próximos</div>

        function renderRoleSpecificDashboardWidget(user) {
            if (user.role === 'pedidos') {
                return `
                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6">
                        <div class="flex items-center justify-between mb-4">
                            <div>
                                <h3 class="text-base font-bold text-slate-900">Fila Prioritária de Análise de Pedidos</h3>

                            </div>
                            <button onclick="switchTab('orders')" class="px-3 py-1.5 bg-sky-600 text-white rounded-lg text-xs font-semibold hover:bg-sky-700 transition">
                                Ir para Análise Completa
                            </button>
                        </div>
                        <div class="divide-y divide-slate-100">
                            ${DB.orders.map(o => `
                                <div class="py-3 flex items-center justify-between">
                                    <div>
                                        <div class="text-sm font-bold text-slate-800">${o.orderNumber} — ${o.unitName}</div>
                                        <div class="text-xs text-slate-500">Solicitado por ${o.requestedBy} em ${o.requestDate}</div>

                `;
            }

            if (user.role === 'organizacao') {
                return `
                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6">
                        <div class="flex items-center justify-between mb-4">
                            <div>
                                <h3 class="text-base font-bold text-slate-900">Conferência Física & Ajustes Pendentes de Aprovação</h3>

                        </div>
                        <div class="space-y-3">
                            ${DB.inventoryCycles[0].items.map(i => `
                                <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between">
                                    <div>
                                        <div class="text-xs font-bold text-slate-800">${i.productName} (Lote: ${i.lotNumber})</div>
                                        <div class="text-xs text-slate-500 mt-0.5">Sistema: <span class="font-bold">${i.systemQty}</span> | Encontrado: <span class="font-bold text-sky-700">${i.countedQty}</span> (Diferença: <span class="${i.diff < 0 ? 'text-rose-600' : 'text-emerald-600'} font-bold">${i.diff}</span>)</div>
                                        <div class="text-[11px] italic text-slate-500 mt-1">Obs: "${i.notes}"</div>
                                    </div>
                                    <span class="px-3 py-1 text-[11px] font-bold rounded-full ${i.status === 'aprovado' ? 'bg-emerald-100 text-emerald-800' : 'bg-purple-100 text-purple-800'}">
                                        ${i.status === 'aprovado' ? 'Aprovado por Eva' : 'Aguardando Aprovação da Coordenadora'}
                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // Default Coordinator / Admin Overview
            return `

                    <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-base font-bold text-slate-900">Central de Atividades Recentes</h3>
                            <button onclick="switchTab('audit')" class="text-xs text-sky-600 hover:text-sky-800 font-semibold">Ver Histórico Inteiro</button>
                        </div>
                        <div class="space-y-4">
                            ${DB.auditLogs.slice(0, 4).map(log => `
                                <div class="flex items-start gap-3 text-xs border-b border-slate-100 pb-3 last:border-0 last:pb-0">
                                    <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 font-bold shrink-0">
                                        <i class="fa-solid fa-user-check text-xs"></i>
                                    </div>
                                    <div class="flex-1">
                                        <div class="font-bold text-slate-800">${log.userName} (${log.userRole})</div>
                                        <div class="text-slate-600 mt-0.5">${log.details}</div>
                                        <div class="text-[10px] text-slate-400 mt-1">${log.date} às ${log.time}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
                        <div class="flex items-center justify-between mb-4">

                                <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-100">
                                    <div>
                                        <div class="text-xs font-bold text-slate-800">${p.name}</div>

                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStockModule() {
            const user = AppState.currentUser;
            const canEdit = user.role === 'administradora' || user.role === 'coordenadora';

            const filteredProducts = DB.products.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(AppState.searchQuery.toLowerCase()) || 
                                      p.code.toLowerCase().includes(AppState.searchQuery.toLowerCase());
                const matchesCat = AppState.filterCategory === 'todas' || p.category === AppState.filterCategory;
                return matchesSearch && matchesCat;
            });

            return `
                <div class="space-y-6">
                    <!-- Page Action Bar -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">Estoque Geral & Lotes (FEFO)</h2>
                            <p class="text-xs text-slate-500">Controle rigoroso de validades, quantidades mínimas e lotes armazenados no Almoxarifado Central.</p>

                        ${canEdit ? `
                            <button onclick="showNewProductModal()" class="px-4 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-semibold text-xs rounded-xl shadow-md transition flex items-center gap-2">
                                <i class="fa-solid fa-plus"></i>
                                <span>Cadastrar Novo Produto</span>
                            </button>
                        ` : ''}

        let currentSelectedPo = null;

        function loadApprovedPoData(poId) {
            const po = DB.approvedPurchaseOrders.find(p => p.id === poId);
            const box = document.getElementById('entry-comparison-box');
            
            if (!po) {
                box.classList.add('hidden');
                currentSelectedPo = null;
                return;
            }

            currentSelectedPo = po;
            box.classList.remove('hidden');

            document.getElementById('disp-approved-lot').innerText = po.approvedLot;
            document.getElementById('disp-approved-qty').innerText = po.approvedQty + ' unidades';
            document.getElementById('disp-approved-exp').innerText = po.approvedExp;

            document.getElementById('input-entry-lot').value = po.approvedLot;
            document.getElementById('input-entry-qty').value = po.approvedQty;
            document.getElementById('input-entry-exp').value = po.approvedExp;

            checkEntryDivergence();
        }

        function checkEntryDivergence() {
            if (!currentSelectedPo) return;

            const inputLot = document.getElementById('input-entry-lot').value.trim();
            const inputQty = parseInt(document.getElementById('input-entry-qty').value) || 0;
            const inputExp = document.getElementById('input-entry-exp').value;

            const diffDiv = document.getElementById('divergence-alert');
            const diffText = document.getElementById('divergence-details-text');

            let diffs = [];

            if (inputLot !== currentSelectedPo.approvedLot) {
                diffs.push(`Lote aprovado: <b>${currentSelectedPo.approvedLot}</b> | Lote informado: <b>${inputLot}</b>`);
            }
            if (inputQty !== currentSelectedPo.approvedQty) {
                diffs.push(`Qtd aprovada: <b>${currentSelectedPo.approvedQty}</b> | Qtd informada: <b>${inputQty}</b>`);
            }
            if (inputExp !== currentSelectedPo.approvedExp) {
                diffs.push(`Validade aprovada: <b>${currentSelectedPo.approvedExp}</b> | Validade informada: <b>${inputExp}</b>`);
            }

            if (diffs.length > 0) {
                diffDiv.classList.remove('hidden');
                diffText.innerHTML = diffs.join('<br>');
            } else {
                diffDiv.classList.add('hidden');
            }
        }

        function confirmEntryRegistration() {
            if (!currentSelectedPo) return;
            const docNum = document.getElementById('entry-doc').value.trim();
            if (!docNum) {
                showToast('Informe o número da Nota Fiscal / Documento!', 'warning');
                return;
            }

            const inputLot = document.getElementById('input-entry-lot').value.trim();
            const inputQty = parseInt(document.getElementById('input-entry-qty').value) || 0;
            const inputExp = document.getElementById('input-entry-exp').value;

            // Update product stock and lot in database
            const product = DB.products.find(p => p.id === currentSelectedPo.productId);
            if (product) {
                product.totalStock += inputQty;
                DB.lots.push({
                    id: 'lot-' + Date.now(),
                    productId: product.id,
                    lotNumber: inputLot,
                    expirationDate: inputExp,
                    quantity: inputQty,
                    healthUnitId: 'unid-0',
                    status: 'normal'
                });
            }

            // Register movement and log audit
            const user = AppState.currentUser;
            DB.movements.unshift({
                id: 'mov-' + Date.now(),
                type: 'entrada',
                productName: currentSelectedPo.productName,
                lotNumber: inputLot,
                quantity: inputQty,
                origin: currentSelectedPo.supplier,
                destination: 'Almoxarifado Central',
                userName: user.name,
                date: new Date().toLocaleDateString('pt-BR'),
                time: new Date().toLocaleTimeString('pt-BR'),
                document: docNum,
                reason: 'Entrada Confirmada no Almoxarifado'
            });

            addAuditLog(user.name, getRoleLabel(user.role), 'Entrada de Estoque', `Registrou a entrada de ${inputQty} un. do produto ${currentSelectedPo.productName} (NF: ${docNum})`, currentSelectedPo.productName);

            showToast('Entrada de estoque realizada com sucesso! Saldo e lotes atualizados.', 'success');
            document.getElementById('entry-comparison-box').classList.add('hidden');
            document.getElementById('entry-po-select').value = '';
            renderApp();
        }

        function updateOrderItemQty(orderId, itemId, newApprovedQty) {
            const order = DB.orders.find(o => o.id === orderId);
            if (!order) return;
            const item = order.items.find(i => i.id === itemId);
            if (!item) return;

            const val = parseInt(newApprovedQty) || 0;
            item.approvedQty = Math.min(val, item.requestedQty);
            item.rejectedQty = item.requestedQty - item.approvedQty;

            if (item.approvedQty === item.requestedQty) {
                item.status = 'aprovado';
                item.reason = 'Atendimento integral aprovado.';
            } else if (item.approvedQty === 0) {
                item.status = 'negado';
                item.reason = 'Item indeferido na análise operacional.';
            } else {
                item.status = 'parcial';
                item.reason = 'Atendimento parcial ajustado ao saldo disponível.';
            }

            renderApp();
            showToast(`Item ${item.productName} atualizado para ${item.approvedQty} unidades aprovadas.`, 'info');
        }

            const order = DB.orders.find(o => o.id === orderId);

            addAuditLog(user.name, getRoleLabel(user.role), 'Análise de Pedido Concluída', `Finalizou a análise do pedido ${order.orderNumber} para a ${order.unitName}`, order.orderNumber);

            showToast(`Pedido ${order.orderNumber} finalizado com sucesso! Enviado para a separação física.`, 'success');
            renderApp();

                            <div class="text-[10px] text-slate-500">Assinatura & Matrícula</div>
                        </div>
                    </div>

                    <!-- Modal Actions -->
                    <div class="flex justify-end gap-3 no-print pt-4 border-t border-slate-200">
                        <button onclick="window.print()" class="px-5 py-2.5 bg-slate-900 text-white font-semibold text-xs rounded-xl hover:bg-black transition flex items-center gap-2">
                            <i class="fa-solid fa-print"></i>
                            <span>Imprimir Documento</span>
                        </button>
                        <button onclick="document.getElementById('printable-order-modal').classList.add('hidden')" class="px-4 py-2.5 bg-slate-200 text-slate-700 font-semibold text-xs rounded-xl hover:bg-slate-300 transition">
                            Fechar
                        </button>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function renderInventoryModule() {
            const cycle = DB.inventoryCycles[0];
            const user = AppState.currentUser;
            const isJoana = user.role === 'organizacao';
            const isEvaOrAdmin = user.role === 'coordenadora' || user.role === 'administradora';

            return `
                <div class="space-y-6">
                    <div>
                        <h2 class="text-xl font-bold text-slate-900">Atualização do Almoxarifado (Conferência Física)</h2>
                        <p class="text-xs text-slate-500">Contagem de prateleira realizada pela equipe de organização e validação oficial pela coordenação.</p>
                    </div>

                    <!-- Active Cycle Banner -->
                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-4">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 pb-4">
                            <div>
                                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-purple-100 text-purple-800 uppercase">Ciclo Ativo • ${cycle.code}</span>
                                <h3 class="text-lg font-bold text-slate-900 mt-1">Responsável: ${cycle.responsible}</h3>
                                <div class="text-xs text-slate-500">Prazo Limite: ${cycle.limitDate} • Aprovação: ${cycle.approver}</div>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-semibold text-amber-700 bg-amber-50 px-3 py-1.5 rounded-xl border border-amber-200">
                                    <i class="fa-solid fa-clock mr-1"></i> Faltam 7 dias para concluir
                                </span>
                            </div>
                        </div>

                        <!-- Count Items Table -->
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-50 font-bold uppercase text-[10px] text-slate-500 border-b border-slate-200">
                                    <tr>
                                        <th class="p-3">Produto Insumo</th>
                                        <th class="p-3">Lote</th>
                                        <th class="p-3">Qtd no Sistema</th>
                                        <th class="p-3">Qtd Encontrada (Física)</th>
                                        <th class="p-3">Diferença</th>
                                        <th class="p-3">Observação da Organização</th>
                                        <th class="p-3">Ação / Status</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${cycle.items.map(item => `
                                        <tr>
                                            <td class="p-3 font-bold text-slate-800">${item.productName}</td>
                                            <td class="p-3 font-mono font-bold text-slate-600">${item.lotNumber}</td>
                                            <td class="p-3 font-bold text-slate-700">${item.systemQty}</td>
                                            <td class="p-3 font-bold text-sky-700">${item.countedQty}</td>
                                            <td class="p-3 font-bold ${item.diff < 0 ? 'text-rose-600' : 'text-emerald-600'}">${item.diff}</td>
                                            <td class="p-3 text-slate-600 italic max-w-xs">${item.notes}</td>
                                            <td class="p-3">
                                                ${item.status === 'pendente_aprovacao' && isEvaOrAdmin ? `
                                                    <div class="flex items-center gap-2">
                                                        <button onclick="approveCountDivergence('${item.id}')" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded text-[11px] transition">
                                                            Aprovar Ajuste
                                                        </button>
                                                    </div>
                                                ` : `
                                                    <span class="px-2.5 py-1 text-[10px] font-bold rounded-full ${item.status === 'aprovado' ? 'bg-emerald-100 text-emerald-800' : 'bg-purple-100 text-purple-800'}">
                                                        ${item.status === 'aprovado' ? 'Ajuste Aprovado' : 'Aguardando Coordenadora'}
                                                    </span>
                                                `}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function approveCountDivergence(itemId) {
            const item = DB.inventoryCycles[0].items.find(i => i.id === itemId);
            if (!item) return;

            item.status = 'aprovado';

            // Apply system adjustment
            const product = DB.products.find(p => p.id === item.productId);
            if (product) {
                product.totalStock += item.diff;
            }

            const user = AppState.currentUser;
            addAuditLog(user.name, getRoleLabel(user.role), 'Aprovação de Divergência', `Aprovou ajuste de contagem física para o produto ${item.productName} (Diferença: ${item.diff})`, item.productName);

            showToast(`Ajuste de estoque aprovado por ${user.name}! Saldo oficial sincronizado com sucesso.`, 'success');
            renderApp();
        }

        function renderMovementsModule() {
            return `
                <div class="space-y-6">
                    <div>
                        <h2 class="text-xl font-bold text-slate-900">Histórico Completo de Movimentações</h2>
                        <p class="text-xs text-slate-500">Registro imutável de todas as entradas, saídas, transferências e doações executadas.</p>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-50 font-bold uppercase text-[10px] text-slate-500 border-b border-slate-200">
                                    <tr>
                                        <th class="p-3">Data / Hora</th>
                                        <th class="p-3">Tipo</th>
                                        <th class="p-3">Produto</th>
                                        <th class="p-3">Lote</th>
                                        <th class="p-3">Quantidade</th>
                                        <th class="p-3">Origem → Destino</th>
                                        <th class="p-3">Responsável</th>
                                        <th class="p-3">Documento / Motivo</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${DB.movements.map(m => `
                                        <tr class="hover:bg-slate-50/50">
                                            <td class="p-3 font-mono text-slate-500">${m.date} ${m.time}</td>
                                            <td class="p-3">
                                                <span class="px-2 py-0.5 text-[10px] font-bold rounded uppercase ${m.type === 'entrada' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                                                    ${m.type}
                                                </span>
                                            </td>
                                            <td class="p-3 font-bold text-slate-800">${m.productName}</td>
                                            <td class="p-3 font-mono text-slate-600 font-bold">${m.lotNumber}</td>
                                            <td class="p-3 font-black text-slate-900">${m.quantity}</td>
                                            <td class="p-3 text-slate-600">${m.origin} → ${m.destination}</td>
                                            <td class="p-3 font-medium text-slate-700">${m.userName}</td>
                                            <td class="p-3 text-slate-500 max-w-xs">${m.document} • ${m.reason}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDonationsModule() {
            return `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">Gestão de Doações (Recebidas & Realizadas)</h2>
                            <p class="text-xs text-slate-500">Rastreabilidade formal de insumos recebidos ou cedidos a instituições públicas parceiras.</p>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-50 font-bold uppercase text-[10px] text-slate-500 border-b border-slate-200">
                                    <tr>
                                        <th class="p-3">Data</th>
                                        <th class="p-3">Modalidade</th>
                                        <th class="p-3">Entidade Doadora/Receptora</th>
                                        <th class="p-3">Produto Insumo</th>
                                        <th class="p-3">Lote</th>
                                        <th class="p-3">Quantidade</th>
                                        <th class="p-3">Termo / Documento</th>
                                        <th class="p-3">Responsável</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${DB.donations.map(d => `
                                        <tr class="hover:bg-slate-50/50">
                                            <td class="p-3 font-mono text-slate-500">${d.date}</td>
                                            <td class="p-3">
                                                <span class="px-2 py-0.5 text-[10px] font-bold rounded ${d.type === 'recebida' ? 'bg-teal-100 text-teal-800' : 'bg-purple-100 text-purple-800'} font-semibold">
                                                    DOAÇÃO ${d.type.toUpperCase()}
                                                </span>
                                            </td>
                                            <td class="p-3 font-bold text-slate-800">${d.entity}</td>
                                            <td class="p-3 text-slate-800 font-medium">${d.product}</td>
                                            <td class="p-3 font-mono font-bold text-slate-600">${d.lot}</td>
                                            <td class="p-3 font-black text-slate-900">${d.qty}</td>
                                            <td class="p-3 text-slate-500 font-mono">${d.document}</td>
                                            <td class="p-3 text-slate-700">${d.responsible}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderHealthUnitsModule() {
            return `
                <div class="space-y-6">
                    <div>
                        <h2 class="text-xl font-bold text-slate-900">Unidades de Saúde Cadastradas</h2>
                        <p class="text-xs text-slate-500">Pontos de atendimento e distribuição vinculados ao Almoxarifado Central da Prefeitura.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${DB.healthUnits.map(unit => `
                            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                                <div class="flex items-center justify-between">
                                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-sky-100 text-sky-800">${unit.code}</span>
                                    <i class="fa-solid fa-hospital-user text-slate-400"></i>
                                </div>
                                <h3 class="text-base font-bold text-slate-900">${unit.name}</h3>
                                <div class="text-xs text-slate-500 space-y-1">
                                    <div><i class="fa-solid fa-location-dot w-4 text-slate-400"></i> ${unit.address}</div>
                                    <div><i class="fa-solid fa-user-doctor w-4 text-slate-400"></i> Resp: ${unit.manager}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

        function renderAuditModule() {
            return `
                <div class="space-y-6">
                    <div>
                        <h2 class="text-xl font-bold text-slate-900">Central de Atividades & Rastreabilidade Geral</h2>
                        <p class="text-xs text-slate-500">Auditoria completa exigida pelos órgãos de controle público e fiscalização da administração.</p>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-50 font-bold uppercase text-[10px] text-slate-500 border-b border-slate-200">
                                    <tr>
                                        <th class="p-3">Horário / Data</th>
                                        <th class="p-3">Servidor Responsável</th>
                                        <th class="p-3">Ação Executada</th>
                                        <th class="p-3">Alvo / Objeto</th>
                                        <th class="p-3">Detalhamento Técnico</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${DB.auditLogs.map(log => `
                                        <tr class="hover:bg-slate-50/50">
                                            <td class="p-3 font-mono text-slate-500">${log.date} ${log.time}</td>
                                            <td class="p-3">
                                                <div class="font-bold text-slate-800">${log.userName}</div>
                                                <div class="text-[10px] text-slate-400 font-medium">${log.userRole}</div>
                                            </td>
                                            <td class="p-3 font-semibold text-sky-700">${log.action}</td>
                                            <td class="p-3 font-bold text-slate-800">${log.target}</td>
                                            <td class="p-3 text-slate-600 max-w-md">${log.details}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderGlobalSearchModal() {
            if (!AppState.isGlobalSearchOpen) return '';

            return `
                <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm p-4 flex justify-center pt-20">
                    <div class="bg-white max-w-xl w-full rounded-2xl shadow-2xl border border-slate-200 overflow-hidden h-fit space-y-4 p-4">
                        <div class="flex items-center gap-3 border-b border-slate-100 pb-3">
                            <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
                            <input id="global-search-input" type="text" placeholder="Pesquisar lote, produto, nota ou pedido..." 
                                class="w-full bg-transparent text-sm focus:outline-none font-medium text-slate-800">
                            <button onclick="toggleGlobalSearch()" class="text-xs text-slate-400 hover:text-slate-600">ESC</button>
                        </div>
                        <div class="text-xs text-slate-500 p-2">
                            Digite qualquer palavra-chave para buscar globalmente na base de dados do almoxarifado.
                        </div>
                    </div>
                </div>
            `;
        }

        // Global Keyboard Shortcut listener for Quick Search
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                toggleGlobalSearch();
            }
        });

        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
