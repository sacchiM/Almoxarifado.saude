            const [users, setUsers] = useState(SEED_USERS);
            const [products, setProducts] = useState(SEED_PRODUCTS);
            const [lotes, setLotes] = useState(SEED_LOTES);
            const [healthUnits, setHealthUnits] = useState(SEED_HEALTH_UNITS);
            const [orders, setOrders] = useState(SEED_ORDERS);
            const [cycles, setCycles] = useState(SEED_CYCLES);
            const [activities, setActivities] = useState(SEED_ACTIVITIES);
            const [donations, setDonations] = useState(SEED_DONATIONS);

            // System Configurations
            const [directUpdateAllowed, setDirectUpdateAllowed] = useState(false); // Config para perfil organizacao alterar direto

            // Navigation & UI States
            const [activeTab, setActiveTab] = useState('dashboard');
            const [globalSearch, setGlobalSearch] = useState('');
            const [selectedOrderForPrint, setSelectedOrderForPrint] = useState(null);
            const [selectedOrderForAnalysis, setSelectedOrderForAnalysis] = useState(null);
            const [toast, setToast] = useState(null);
            const [modal, setModal] = useState(null);

                    window.lucide.createIcons();

            });

                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

                if (!currentUser) return;
                const newAct = {
                    id: 'act-' + Date.now(),
                    usuario: currentUser.nome,
                    cargo: currentUser.cargo,
                    acao,
                    produto: produto || '-',
                    quantidade: quantidade || 0,
                    unidade: unidade || 'Almoxarifado Central',
                    data: new Date().toLocaleDateString('pt-BR') + ' às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
                    status
                };
                setActivities(prev => [newAct, ...prev]);
            };

            // Helper FEFO stock calculator
            const getProductStockSummary = useMemo(() => {
                const map = {};
                products.forEach(p => {
                    const pLotes = lotes.filter(l => l.produtoId === p.id);
                    const totalQtd = pLotes.reduce((acc, curr) => acc + curr.quantidade, 0);

                    // Check expiration FEFO
                    const today = new Date().toISOString().split('T')[0];
                    const thirtyDays = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];

                    let expiredCount = 0;
                    let nearExpiryCount = 0;

                    pLotes.forEach(l => {
                        if (l.validade < today) expiredCount += l.quantidade;
                        else if (l.validade <= thirtyDays) nearExpiryCount += l.quantidade;
                    });

                    let status = 'NORMAL';
                    if (totalQtd === 0) status = 'EM_FALTA';
                    else if (totalQtd < p.estoqueMinimo) status = 'ESTOQUE_BAIXO';

                    map[p.id] = {
                        totalQtd,
                        status,
                        expiredCount,
                        nearExpiryCount,
                        lotesCount: pLotes.length
                    };
                });
                return map;
            }, [products, lotes]);

                e.preventDefault();
                setLoginError('');

                const cleanLogin = loginInput.trim().toLowerCase();
                const userFound = users.find(u => u.login === cleanLogin);

                if (!userFound) {
                    setLoginError('Login não encontrado. O formato deve ser nome.cargo (ex: eva.coordenadora)');
                    return;
                }

                if (userFound.senhaHash !== passwordInput) {
                    setLoginError('Senha incorreta para a conta informada.');
                    return;
                }

                if (userFound.status !== 'Ativo') {
                    setLoginError('Esta conta de usuário encontra-se desativada.');
                    return;
                }

                setCurrentUser(userFound);
                setActiveTab('dashboard');
                showToast(`Bem-vinda(o), ${userFound.nome}! Sessão iniciada com sucesso.`);
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setLoginInput('');
                setPasswordInput('');
                setLoginError('');
            };

            // Quick demo login preset helper
            const fillDemoUser = (login) => {
                setLoginInput(login);
                setPasswordInput('demo123');
                setLoginError('');
            };

            if (!currentUser) {
                return (
                    <div className="min-h-screen bg-slate-100 flex flex-col justify-center py-12 sm:px-6 lg:px-8">

                            </p>

                                            login <span className="text-slate-400 font-normal">(formato nome.cargo)</span>
                                        </label>
                                        <div className="mt-2 relative">

                                                type="text"
                                                required
                                                value={loginInput}
                                                onChange={(e) => setLoginInput(e.target.value)}

                                                className="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm font-mono transition"
                                            />
                                        </div>
                                    </div>

                                            senha
                                        </label>
                                        <div className="mt-2">
                                            <input
                                                type="password"
                                                required
                                                value={passwordInput}
                                                onChange={(e) => setPasswordInput(e.target.value)}

                                                className="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm transition"
                                            />
                                        </div>
                                    </div>

                                                <p className="text-xs font-medium text-red-800">{loginError}</p>
                                            </div>
                                        </div>
                                    )}

                                    <div>
                                        <button
                                            type="submit"
                                            className="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-md text-sm font-semibold text-white bg-sky-600 hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 transition"

                                        </button>

                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => fillDemoUser('maria.administradora')}
                                            className="p-2 rounded-lg bg-slate-50 hover:bg-sky-50 border border-slate-200 text-left transition"
                                        >
                                            <span className="font-bold block text-slate-800">maria.administradora</span>
                                            <span className="text-[10px] text-slate-500">Administradora</span>
                                        </button>

                                    <i data-lucide="package" className="w-4 h-4"></i>
                                    <span>Estoque & Lotes</span>
                                </button>

                                <button
                                    onClick={() => setActiveTab('entradas')}
                                    className={`px-3 py-2 rounded-lg flex items-center space-x-2 transition ${activeTab === 'entradas' ? 'bg-sky-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-200/60'}`}

                                    <i data-lucide="arrow-down-left" className="w-4 h-4"></i>
                                    <span>Entradas & Divergências</span>
                                </button>

                                    onClick={() => setActiveTab('pedidos')}

                                    <i data-lucide="shopping-bag" className="w-4 h-4"></i>
                                    <span>Análise de Pedidos</span>

                                    onClick={() => setActiveTab('doacoes')}

                        {/* TAB 1: DASHBOARD (ADAPTIVE PER USER ROLE) */}

                            <DashboardView
                                currentUser={currentUser}
                                products={products}
                                lotes={lotes}
                                orders={orders}
                                cycles={cycles}
                                activities={activities}
                                getProductStockSummary={getProductStockSummary}
                                setActiveTab={setActiveTab}

                        )}

                        {/* TAB 2: ESTOQUE & LOTES (FEFO PRIORITY) */}
                        {activeTab === 'estoque' && (
                            <StockLotesView
                                products={products}
                                lotes={lotes}
                                setLotes={setLotes}
                                getProductStockSummary={getProductStockSummary}
                                currentUser={currentUser}
                                logActivity={logActivity}
                                showToast={showToast}
                            />
                        )}

                        {/* TAB 3: ENTRADAS & DIVERGÊNCIAS DE NOTAS */}
                        {activeTab === 'entradas' && (
                            <InboundReceivingView
                                products={products}
                                lotes={lotes}
                                setLotes={setLotes}
                                currentUser={currentUser}
                                logActivity={logActivity}
                                showToast={showToast}
                            />
                        )}

                        {/* TAB 4: PEDIDOS & ANÁLISE DAS UNIDADES */}
                        {activeTab === 'pedidos' && (
                            <OrdersAnalysisView
                                orders={orders}
                                setOrders={setOrders}
                                products={products}
                                lotes={lotes}
                                getProductStockSummary={getProductStockSummary}
                                currentUser={currentUser}
                                setSelectedOrderForPrint={setSelectedOrderForPrint}
                                logActivity={logActivity}
                                showToast={showToast}
                            />
                        )}

                        {/* TAB 5: ATUALIZAÇÃO DO ALMOXARIFADO (CICLOS DE CONTAGEM FISICA) */}
                        {activeTab === 'atualizacoes' && (
                            <InventoryCyclesView
                                cycles={cycles}
                                setCycles={setCycles}
                                products={products}
                                lotes={lotes}
                                setLotes={setLotes}
                                currentUser={currentUser}
                                directUpdateAllowed={directUpdateAllowed}
                                setDirectUpdateAllowed={setDirectUpdateAllowed}
                                logActivity={logActivity}
                                showToast={showToast}
                            />
                        )}

                        {/* TAB 6: DOAÇÕES RECEBIDAS E REALIZADAS */}

                            <DonationsView

                                logActivity={logActivity}

                        {activeTab === 'atividades' && (

                        {/* TAB 8: GESTÃO DE USUÁRIOS (ADMIN ONLY) */}
                        {activeTab === 'usuarios' && currentUser.role === 'ADMIN' && (
                            <UserManagementView

                                setUsers={setUsers}

                    {selectedOrderForPrint && (
                        <PrintableOrderSlip order={selectedOrderForPrint} />

                    {/* FOOTER */}
                    <footer className="bg-white border-t border-slate-200 mt-auto py-4 px-6 text-center text-xs text-slate-500 no-print">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center space-y-2 sm:space-y-0">
                            <div>
                                <span className="font-bold text-slate-700">Almoxarifado da Saúde</span> — Sistema de Gestão Pública Digital & Rastreável
                            </div>
                            <div>
                                Sessão Ativa: <span className="font-mono font-semibold text-slate-800">{currentUser.login}</span> | Perfis & Segurança Ativos
                            </div>
                        </div>
                    </footer>
                </div>
