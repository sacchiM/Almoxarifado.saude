        }

        function DashboardView({ currentUser, products, lotes, orders, cycles, activities, getProductStockSummary, setActiveTab }) {
            // Calculated Metrics
            const totalProducts = products.length;
            let lowStockCount = 0;
            let outOfStockCount = 0;
            let expiredCount = 0;
            let nearExpiryCount = 0;

            Object.values(getProductStockSummary).forEach(s => {
                if (s.status === 'ESTOQUE_BAIXO') lowStockCount++;
                if (s.status === 'EM_FALTA') outOfStockCount++;
                if (s.expiredCount > 0) expiredCount++;
                if (s.nearExpiryCount > 0) nearExpiryCount++;
            });

            const pendingOrders = orders.filter(o => o.status === 'enviado' || o.status === 'em_analise').length;

            return (
                <div className="space-y-6">
                    {/* Welcome Header Banner */}
                    <div className="bg-gradient-to-r from-sky-700 to-sky-900 rounded-2xl p-6 text-white shadow-md flex flex-col md:flex-row justify-between items-start md:items-center">
                        <div>
                            <div className="text-xs font-bold uppercase tracking-wider text-sky-200 mb-1">
                                Painel Principal
                            </div>
                            <h2 className="text-2xl font-bold capitalize">olá, {currentUser.nome}</h2>
                            <p className="text-sky-100 text-sm mt-1">{currentUser.descCargo}</p>
                        </div>
                        <div className="mt-4 md:mt-0 flex space-x-2">
                            <span className="bg-sky-800/80 border border-sky-600 text-sky-100 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center">
                                <i data-lucide="shield" className="w-4 h-4 mr-1.5 text-emerald-400"></i>
                                Perfil: {currentUser.role}
                            </span>
                        </div>
                    </div>

                    {/* METRIC CARDS ROW */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow transition">
                            <div className="flex items-center justify-between text-slate-500 mb-2">
                                <span className="text-xs font-bold uppercase tracking-wider">Itens sem Estoque</span>
                                <div className="p-2 bg-red-50 text-red-600 rounded-xl">
                                    <i data-lucide="alert-octagon" className="w-5 h-5"></i>
                                </div>
                            </div>
                            <div className="text-2xl font-black text-slate-900">{outOfStockCount}</div>
                            <div className="text-xs text-red-600 font-medium mt-1">🔴 Requer atenção imediata</div>
                        </div>

                        <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow transition">
                            <div className="flex items-center justify-between text-slate-500 mb-2">
                                <span className="text-xs font-bold uppercase tracking-wider">Estoque Baixo</span>
                                <div className="p-2 bg-amber-50 text-amber-600 rounded-xl">
                                    <i data-lucide="alert-triangle" className="w-5 h-5"></i>
                                </div>
                            </div>
                            <div className="text-2xl font-black text-slate-900">{lowStockCount}</div>
                            <div className="text-xs text-amber-600 font-medium mt-1">🟠 Abaixo do estoque mínimo</div>
                        </div>

                        <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow transition">
                            <div className="flex items-center justify-between text-slate-500 mb-2">
                                <span className="text-xs font-bold uppercase tracking-wider">Próximos Vencimento</span>
                                <div className="p-2 bg-yellow-50 text-yellow-600 rounded-xl">
                                    <i data-lucide="clock" className="w-5 h-5"></i>
                                </div>
                            </div>
                            <div className="text-2xl font-black text-slate-900">{nearExpiryCount}</div>
                            <div className="text-xs text-yellow-700 font-medium mt-1">🟡 Vencimento &lt; 30 dias</div>
                        </div>

                        <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow transition">
                            <div className="flex items-center justify-between text-slate-500 mb-2">
                                <span className="text-xs font-bold uppercase tracking-wider">Pedidos Pendentes</span>
                                <div className="p-2 bg-sky-50 text-sky-600 rounded-xl">
                                    <i data-lucide="file-text" className="w-5 h-5"></i>
                                </div>
                            </div>
                            <div className="text-2xl font-black text-slate-900">{pendingOrders}</div>
                            <div className="text-xs text-sky-600 font-medium mt-1">Aguardando análise e envio</div>
                        </div>
                    </div>

                    {/* ROLE-SPECIFIC QUICK ACTION DASHBOARD CARDS */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {/* Critical Alerts & FEFO Prioritization */}
                        <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="font-bold text-slate-900 text-sm uppercase tracking-wider flex items-center">
                                    <i data-lucide="bell" className="w-4 h-4 mr-2 text-sky-600"></i>
                                    Alertas Críticos do Almoxarifado
                                </h3>
                                <button onClick={() => setActiveTab('estoque')} className="text-xs font-semibold text-sky-600 hover:underline">
                                    Ver estoque completo &rarr;
                                </button>
                            </div>
                            <div className="space-y-3">
                                {products.map(p => {
                                    const summary = getProductStockSummary[p.id];
                                    if (summary.status === 'NORMAL' && summary.nearExpiryCount === 0 && summary.expiredCount === 0) return null;
                                    return (
                                        <div key={p.id} className="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-200/60 text-xs">
                                            <div>
                                                <div className="font-bold text-slate-800">{p.nome}</div>
                                                <div className="text-slate-500">Cód: {p.codigo} | Est. Mínimo: {p.estoqueMinimo}</div>
                                            </div>
                                            <div className="text-right">
                                                {summary.status === 'EM_FALTA' && (
                                                    <span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-red-100 text-red-800">🔴 Em falta</span>
                                                )}
                                                {summary.status === 'ESTOQUE_BAIXO' && (
                                                    <span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800">🟠 {summary.totalQtd} em estoque</span>
                                                )}
                                                {summary.nearExpiryCount > 0 && (
                                                    <span className="ml-1 px-2.5 py-1 rounded-full text-[10px] font-bold bg-yellow-100 text-yellow-800">🟡 Vencimento Próximo</span>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Recent Activity Log Preview */}
                        <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="font-bold text-slate-900 text-sm uppercase tracking-wider flex items-center">
                                    <i data-lucide="history" className="w-4 h-4 mr-2 text-sky-600"></i>
                                    Atividades Recentes & Rastreabilidade
                                </h3>
                                <button onClick={() => setActiveTab('atividades')} className="text-xs font-semibold text-sky-600 hover:underline">
                                    Ver auditoria &rarr;
                                </button>
                            </div>
                            <div className="space-y-3">
                                {activities.slice(0, 4).map(act => (
                                    <div key={act.id} className="p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs">
                                        <div className="flex justify-between items-center">
                                            <span className="font-bold text-slate-800">{act.usuario} ({act.cargo})</span>
                                            <span className="text-[10px] text-slate-400">{act.data}</span>
                                        </div>
                                        <div className="text-slate-600 mt-1 font-medium">{act.acao}</div>
                                        <div className="text-[11px] text-slate-500 mt-0.5">
                                            Produto: {act.produto} • Qtd: {act.quantidade} • {act.unidade}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function StockLotesView({ products, lotes, setLotes, getProductStockSummary, currentUser, logActivity, showToast }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('TODOS');
            const [filterStatus, setFilterStatus] = useState('TODOS');
            const [showNewLoteModal, setShowNewLoteModal] = useState(false);

            // New Lote Form State
            const [newLoteProdId, setNewLoteProdId] = useState(products[0]?.id || '');
            const [newLoteCodigo, setNewLoteCodigo] = useState('');
            const [newLoteValidade, setNewLoteValidade] = useState('');
            const [newLoteQtd, setNewLoteQtd] = useState('');
            const [newLoteFornecedor, setNewLoteFornecedor] = useState('');

            const filteredProducts = products.filter(p => {
                const matchesSearch = p.nome.toLowerCase().includes(searchTerm.toLowerCase()) || p.codigo.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesCategory = selectedCategory === 'TODOS' || p.categoria === selectedCategory;
                const summary = getProductStockSummary[p.id];
                const matchesStatus = filterStatus === 'TODOS' || summary.status === filterStatus;

                return matchesSearch && matchesCategory && matchesStatus;
            });

            const handleCreateLote = (e) => {
                e.preventDefault();
                if (!newLoteCodigo || !newLoteValidade || !newLoteQtd) {
                    alert('Preencha todos os campos obrigatórios do lote.');
                    return;
                }

                const newLoteObj = {
                    id: 'l-' + Date.now(),
                    produtoId: newLoteProdId,
                    lote: newLoteCodigo,
                    validade: newLoteValidade,
                    quantidade: parseInt(newLoteQtd, 10),
                    fornecedor: newLoteFornecedor || 'Fornecedor Cadastrado'
                };

                setLotes(prev => [...prev, newLoteObj]);
                const p = products.find(prod => prod.id === newLoteProdId);
                logActivity('Cadastro Direto de Lote de Estoque', p ? p.nome : 'Produto', newLoteQtd, 'Almoxarifado Central');
                showToast(`Lote ${newLoteCodigo} adicionado com sucesso!`);

                setShowNewLoteModal(false);
                setNewLoteCodigo('');
                setNewLoteValidade('');
                setNewLoteQtd('');
            };

            return (
                <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h2 className="text-xl font-bold text-slate-900">Estoque Geral & Rastreabilidade de Lotes</h2>
                            <p className="text-xs text-slate-500">Controle por princípio FEFO (First Expire, First Out) e validade.</p>
                        </div>
                        {(currentUser.role === 'ADMIN' || currentUser.role === 'COORDENADORA') && (
                            <button
                                onClick={() => setShowNewLoteModal(true)}
                                className="px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-xl font-semibold text-xs shadow-sm transition flex items-center"
                            >
                                <i data-lucide="plus-circle" className="w-4 h-4 mr-2"></i>
                                Cadastrar Novo Lote
                            </button>
                        )}
                    </div>

                    {/* FILTERS TOOLBAR */}
                    <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col md:flex-row gap-3">
                        <div className="flex-1 relative">
                            <input
                                type="text"
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                placeholder="Filtrar por nome ou código..."
                                className="w-full pl-9 pr-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500"
                            />
                            <i data-lucide="search" className="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
                        </div>

                        <select
                            value={selectedCategory}
                            onChange={(e) => setSelectedCategory(e.target.value)}
                            className="text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500 font-medium"
                        >
                            <option value="TODOS">Todas as Categorias</option>
                            {SEED_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>

                        <select
                            value={filterStatus}
                            onChange={(e) => setFilterStatus(e.target.value)}
                            className="text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500 font-medium"
                        >
                            <option value="TODOS">Todos os Status</option>
                            <option value="NORMAL">Estoque Regular</option>
                            <option value="ESTOQUE_BAIXO">Estoque Baixo 🟠</option>
                            <option value="EM_FALTA">Em Falta 🔴</option>
                        </select>
                    </div>

                    {/* PRODUCTS TABLE */}
                    <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs text-slate-700">
                                <thead className="bg-slate-50 border-b border-slate-200 font-bold uppercase tracking-wider text-slate-500">
                                    <tr>
                                        <th className="p-4">Código / Produto</th>
                                        <th className="p-4">Categoria</th>
                                        <th className="p-4">Localização</th>
                                        <th className="p-4 text-center">Total Estoque</th>
                                        <th className="p-4">Lotes Ativos (FEFO)</th>
                                        <th className="p-4 text-right">Status</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {filteredProducts.map(p => {
                                        const summary = getProductStockSummary[p.id];
                                        const pLotes = lotes
                                            .filter(l => l.produtoId === p.id)
                                            .sort((a, b) => new Date(a.validade) - new Date(b.validade));

                                        return (
                                            <tr key={p.id} className="hover:bg-slate-50/80 transition">
                                                <td className="p-4">
                                                    <div className="font-bold text-slate-900 text-sm">{p.nome}</div>
                                                    <div className="text-slate-400 font-mono text-[11px]">Cód: {p.codigo} | {p.unidadeMedida}</div>
                                                </td>
                                                <td className="p-4 font-medium text-slate-600">{p.categoria}</td>
                                                <td className="p-4 font-mono text-slate-500">{p.localizacao}</td>
                                                <td className="p-4 text-center">
                                                    <span className="font-black text-sm text-slate-900">{summary.totalQtd}</span>
                                                    <span className="text-[10px] text-slate-400 block">Min: {p.estoqueMinimo}</span>
                                                </td>
                                                <td className="p-4">
                                                    <div className="space-y-1">
                                                        {pLotes.map((l, idx) => (
                                                            <div key={l.id} className="flex items-center space-x-2 text-[11px]">
                                                                <span className="font-mono font-bold bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200">{l.lote}</span>
                                                                <span className="text-slate-600 font-semibold">{l.quantidade} un.</span>
                                                                <span className={`text-[10px] px-1 rounded ${new Date(l.validade) < new Date() ? 'bg-red-100 text-red-800 font-bold' : 'text-slate-500'}`}>
                                                                    Val: {new Date(l.validade).toLocaleDateString('pt-BR')}
                                                                </span>
                                                                {idx === 0 && pLotes.length > 1 && (
                                                                    <span className="text-[9px] bg-emerald-100 text-emerald-800 font-bold px-1 rounded">FEFO Próximo</span>
                                                                )}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </td>
                                                <td className="p-4 text-right">
                                                    {summary.status === 'EM_FALTA' && (
                                                        <span className="px-3 py-1 rounded-full text-[10px] font-bold bg-red-100 text-red-800">🔴 Em Falta</span>
                                                    )}
                                                    {summary.status === 'ESTOQUE_BAIXO' && (
                                                        <span className="px-3 py-1 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800">🟠 Estoque Baixo</span>
                                                    )}
                                                    {summary.status === 'NORMAL' && (
                                                        <span className="px-3 py-1 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">🟢 Regular</span>
                                                    )}
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* NEW LOTE MODAL */}
                    {showNewLoteModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-bold text-slate-900 text-base">Cadastrar Novo Lote no Estoque</h3>
                                    <button onClick={() => setShowNewLoteModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>
                                <form onSubmit={handleCreateLote} className="space-y-4 text-xs">
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">Produto</label>
                                        <select
                                            value={newLoteProdId}
                                            onChange={(e) => setNewLoteProdId(e.target.value)}
                                            className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                        >
                                            {products.map(p => <option key={p.id} value={p.id}>{p.nome} ({p.codigo})</option>)}
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">Código do Lote</label>
                                            <input
                                                type="text"
                                                required
                                                placeholder="EX: LOTE-2026-X"
                                                value={newLoteCodigo}
                                                onChange={(e) => setNewLoteCodigo(e.target.value)}
                                                className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono"
                                            />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">Validade</label>
                                            <input
                                                type="date"
                                                required
                                                value={newLoteValidade}
                                                onChange={(e) => setNewLoteValidade(e.target.value)}
                                                className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                            />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">Quantidade</label>
                                            <input
                                                type="number"
                                                min="1"
                                                required
                                                placeholder="Ex: 500"
                                                value={newLoteQtd}
                                                onChange={(e) => setNewLoteQtd(e.target.value)}
                                                className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                            />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">Fornecedor</label>
                                            <input
                                                type="text"
                                                placeholder="Laboratório / Distribuidor"
                                                value={newLoteFornecedor}
                                                onChange={(e) => setNewLoteFornecedor(e.target.value)}
                                                className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                            />
                                        </div>
                                    </div>

                                    <div className="pt-4 flex justify-end space-x-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowNewLoteModal(false)}
                                            className="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl font-semibold hover:bg-slate-200"
                                        >
                                            Cancelar
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-4 py-2 bg-sky-600 text-white rounded-xl font-semibold hover:bg-sky-700"
                                        >
                                            Salvar Lote
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function InboundReceivingView({ products, lotes, setLotes, currentUser, logActivity, showToast }) {
            const [selectedProdId, setSelectedProdId] = useState(products[0]?.id || '');
            const [inputCodigo, setInputCodigo] = useState('');
            const [inputLote, setInputLote] = useState('');
            const [inputValidade, setInputValidade] = useState('');
            const [inputQtd, setInputQtd] = useState('');
            const [inputDoc, setInputDoc] = useState('');

            // Pre-approved specifications simulation
            const targetProd = products.find(p => p.id === selectedProdId);

            // Compute Divergence
            const hasDivergence = targetProd && inputCodigo && (inputCodigo !== targetProd.codigo);

            const handleConfirmEntry = (e) => {
                e.preventDefault();
                if (hasDivergence) {
                    alert('⚠️ Existem divergências no código do produto! O recebimento automático não é permitido sem justificativa.');
                    return;
                }

                const newLoteObj = {
                    id: 'l-in-' + Date.now(),
                    produtoId: selectedProdId,
                    lote: inputLote,
                    validade: inputValidade,
                    quantidade: parseInt(inputQtd, 10),
                    fornecedor: `NF-e #${inputDoc || 'S/N'}`
                };

                setLotes(prev => [...prev, newLoteObj]);
                logActivity(`Entrada Conferida via Nota Fiscal #${inputDoc}`, targetProd.nome, inputQtd, 'Almoxarifado Central');
                showToast(`Entrada do produto ${targetProd.nome} registrada com sucesso!`);

                setInputCodigo('');
                setInputLote('');
                setInputValidade('');
                setInputQtd('');
                setInputDoc('');
            };

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-xl font-bold text-slate-900">Entrada de Materiais & Conferência de Divergências</h2>
                        <p className="text-xs text-slate-500">Confronte os dados físicos da nota de entrega com o cadastro aprovado antes do aceite definitivo.</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* FORM ENTRY INPUTS */}
                        <div className="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                            <h3 className="font-bold text-slate-800 text-sm uppercase tracking-wider">Dados do Documento & Produto Entregue</h3>

                            <form onSubmit={handleConfirmEntry} className="space-y-4 text-xs">
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">Selecione o Produto Pré-Aprovado</label>
                                        <select
                                            value={selectedProdId}
                                            onChange={(e) => {
                                                setSelectedProdId(e.target.value);
                                                const p = products.find(prod => prod.id === e.target.value);
                                                if (p) setInputCodigo(p.codigo);
                                            }}
                                            className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-medium"
                                        >
                                            {products.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">Número da Nota Fiscal / Documento</label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="Ex: NF-e 882910"
                                            value={inputDoc}
                                            onChange={(e) => setInputDoc(e.target.value)}
                                            className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                        />
                                    </div>
                                </div>

                                <div className="grid grid-cols-3 gap-4">
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">Código Informado na Caixa</label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="Ex: MED-1001"
                                            value={inputCodigo}
                                            onChange={(e) => setInputCodigo(e.target.value)}
                                            className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono"
                                        />
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">Lote Físico</label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="Ex: LOTE-ABC-2026"
                                            value={inputLote}
                                            onChange={(e) => setInputLote(e.target.value)}
                                            className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono"
                                        />
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">Data de Validade</label>
                                        <input
                                            type="date"
                                            required
                                            value={inputValidade}
                                            onChange={(e) => setInputValidade(e.target.value)}
                                            className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                        />
                                    </div>
                                </div>

                                <div>
                                    <label className="block font-bold text-slate-700 mb-1">Quantidade Recebida (Unidades Físicas)</label>
                                    <input
                                        type="number"
                                        min="1"
                                        required
                                        placeholder="Ex: 1000"
                                        value={inputQtd}
                                        onChange={(e) => setInputQtd(e.target.value)}
                                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold"
                                    />
                                </div>

                                <div className="pt-2">
                                    <button
                                        type="submit"
                                        disabled={hasDivergence}
                                        className={`w-full py-3 rounded-xl font-bold text-white transition flex justify-center items-center ${hasDivergence ? 'bg-slate-300 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700 shadow-md'}`}
                                    >
                                        <i data-lucide="check-square" className="w-4 h-4 mr-2"></i>
                                        Confirmar Entrada & Atualizar Estoque Oficial
                                    </button>
                                </div>
                            </form>
                        </div>

                        {/* LIVE DIVERGENCE COMPARISON PANEL */}
                        <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                            <div>
                                <h3 className="font-bold text-slate-800 text-sm uppercase tracking-wider mb-4">Painel de Conferência de Dados</h3>

                                {targetProd && (
                                    <div className="space-y-4 text-xs">
                                        <div className="p-3 bg-slate-50 rounded-xl border border-slate-200">
                                            <div className="text-slate-400 font-bold uppercase text-[10px]">Dados Aprovados no Sistema</div>
                                            <div className="font-bold text-slate-800 text-sm mt-1">{targetProd.nome}</div>
                                            <div className="text-slate-600 font-mono mt-0.5">Código Oficial: {targetProd.codigo}</div>
                                        </div>

                                        <div className="p-3 bg-slate-50 rounded-xl border border-slate-200">
                                            <div className="text-slate-400 font-bold uppercase text-[10px]">Dados Informados do Recebimento</div>
                                            <div className="font-mono font-bold text-slate-800 text-xs mt-1">
                                                Código Informado: {inputCodigo || 'Não digitado'}
                                            </div>
                                        </div>

                                        {hasDivergence ? (
                                            <div className="p-4 bg-red-50 rounded-xl border border-red-200 text-red-800 space-y-2">
                                                <div className="flex items-center font-bold">
                                                    <i data-lucide="alert-triangle" className="w-5 h-5 mr-2 text-red-600"></i>
                                                    DIVERGÊNCIA DETECTADA!
                                                </div>
                                                <p className="text-[11px]">
                                                    O código digitado (<span className="font-mono font-bold">{inputCodigo}</span>) difere do código aprovado (<span className="font-mono font-bold">{targetProd.codigo}</span>).
                                                </p>
                                                <div className="pt-2">
                                                    <button
                                                        type="button"
                                                        onClick={() => setInputCodigo(targetProd.codigo)}
                                                        className="text-[10px] font-bold bg-red-100 hover:bg-red-200 px-3 py-1.5 rounded-lg text-red-900 transition"
                                                    >
                                                        Corrigir código para o aprovado
                                                    </button>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="p-4 bg-emerald-50 rounded-xl border border-emerald-200 text-emerald-800 flex items-center">
                                                <i data-lucide="check-circle-2" className="w-5 h-5 mr-2 text-emerald-600"></i>
                                                <span className="font-bold text-xs">Conferência Aprovada — Dados compatíveis.</span>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function OrdersAnalysisView({ orders, setOrders, products, lotes, getProductStockSummary, currentUser, setSelectedOrderForPrint, logActivity, showToast }) {
            const [selectedOrder, setSelectedOrder] = useState(orders[0] || null);

            const handleAnalyzeItem = (orderId, prodId, aprovadoVal, negadoVal, motivoVal) => {
                setOrders(prev => prev.map(o => {
                    if (o.id !== orderId) return o;
                    const updatedItens = o.itens.map(it => {
                        if (it.produtoId !== prodId) return it;
                        return {
                            ...it,
                            aprovado: parseInt(aprovadoVal, 10),
                            negado: parseInt(negadoVal, 10),
                            motivo: motivoVal
                        };
                    });
                    return { ...o, itens: updatedItens, status: 'em_analise' };
                }));
                showToast('Item atualizado no pedido.');
            };

            const handleFinalizeAnalysis = (orderId) => {
                setOrders(prev => prev.map(o => {
                    if (o.id !== orderId) return o;
                    return { ...o, status: 'pronto_separacao' };
                }));
                const ord = orders.find(o => o.id === orderId);
                logActivity(`Análise de Pedido Concluída (${ord ? ord.unidadeNome : ''})`, 'Múltiplos Itens', 0, ord ? ord.unidadeNome : '');
                showToast('Pedido analisado e liberado para separação física!');
            };

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-xl font-bold text-slate-900">Análise Item por Item dos Pedidos das Unidades</h2>
                        <p className="text-xs text-slate-500">Verifique o estoque disponível e aprove/ajuste as quantidades solicitadas.</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* ORDERS LIST COLUMN */}
                        <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                            <h3 className="font-bold text-slate-800 text-xs uppercase tracking-wider mb-2">Pedidos Recebidos</h3>
                            {orders.map(o => (
                                <div
                                    key={o.id}
                                    onClick={() => setSelectedOrder(o)}
                                    className={`p-3.5 rounded-xl border cursor-pointer transition text-xs ${selectedOrder?.id === o.id ? 'border-sky-500 bg-sky-50/50 shadow-sm' : 'border-slate-200 hover:bg-slate-50'}`}
                                >
                                    <div className="flex justify-between items-center font-bold">
                                        <span className="text-slate-900">{o.unidadeNome}</span>
                                        <span className="font-mono text-slate-500 text-[10px]">{o.id}</span>
                                    </div>
                                    <div className="text-slate-500 mt-1">Solicitante: {o.solicitante}</div>
                                    <div className="flex justify-between items-center mt-2">
                                        <span className="text-[10px] text-slate-400">{new Date(o.dataCriacao).toLocaleDateString('pt-BR')}</span>
                                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                            o.status === 'pronto_separacao' ? 'bg-emerald-100 text-emerald-800' :
                                            o.status === 'em_analise' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-700'
                                        }`}>
                                            {o.status === 'pronto_separacao' ? 'Pronto Separação' : o.status === 'em_analise' ? 'Em Análise' : 'Enviado'}
                                        </span>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* ORDER ITEM-BY-ITEM DETAILED ANALYSIS PANEL */}
                        <div className="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
                            {selectedOrder ? (
                                <div className="space-y-6">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-200 pb-4">
                                        <div>
                                            <span className="text-xs font-bold text-sky-600 uppercase tracking-wider">Pedido #{selectedOrder.id}</span>
                                            <h3 className="text-lg font-bold text-slate-900">{selectedOrder.unidadeNome}</h3>
                                            <p className="text-xs text-slate-500">Observação da Unidade: {selectedOrder.observacao}</p>
                                        </div>
                                        <div className="mt-2 sm:mt-0 flex space-x-2">
                                            {selectedOrder.status === 'pronto_separacao' && (
                                                <button
                                                    onClick={() => {
                                                        setSelectedOrderForPrint(selectedOrder);
                                                        setTimeout(() => window.print(), 300);
                                                    }}
                                                    className="px-3 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-semibold shadow-sm transition flex items-center"
                                                >
                                                    <i data-lucide="printer" className="w-4 h-4 mr-2"></i>
                                                    Imprimir Pedido A4
                                                </button>
                                            )}
                                        </div>
                                    </div>

                                    {/* ITEMS TABLE */}
                                    <div className="space-y-4">
                                        {selectedOrder.itens.map(it => {
                                            const p = products.find(prod => prod.id === it.produtoId);
                                            const summary = p ? getProductStockSummary[p.id] : { totalQtd: 0 };
                                            const approvedVal = it.aprovado !== null ? it.aprovado : it.solicitado;
                                            const deniedVal = it.negado !== null ? it.negado : 0;

                                            return (
                                                <div key={it.produtoId} className="p-4 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-3">
                                                    <div className="flex justify-between items-start">
                                                        <div>
                                                            <span className="font-bold text-slate-900 text-sm">{it.produtoNome}</span>
                                                            <div className="text-slate-500 mt-0.5">
                                                                Solicitado: <span className="font-bold text-slate-800">{it.solicitado} un.</span> |
                                                                Estoque Disponível Central: <span className={`font-bold ${summary.totalQtd < it.solicitado ? 'text-amber-600' : 'text-emerald-600'}`}>{summary.totalQtd} un.</span>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 border-t border-slate-200/60">
                                                        <div>
                                                            <label className="block text-[10px] font-bold text-slate-600 uppercase">Qtd. a Enviar</label>
                                                            <input
                                                                type="number"
                                                                value={approvedVal}
                                                                onChange={(e) => {
                                                                    const val = parseInt(e.target.value, 10) || 0;
                                                                    const denied = Math.max(0, it.solicitado - val);
                                                                    handleAnalyzeItem(selectedOrder.id, it.produtoId, val, denied, it.motivo);
                                                                }}
                                                                className="w-full mt-1 p-2 bg-white border border-slate-300 rounded-lg font-bold text-slate-800"
                                                            />
                                                        </div>

                                                        <div>
                                                            <label className="block text-[10px] font-bold text-slate-600 uppercase">Qtd. Não Enviada</label>
                                                            <input
                                                                type="number"
                                                                readOnly
                                                                value={deniedVal}
                                                                className="w-full mt-1 p-2 bg-slate-100 border border-slate-200 rounded-lg text-slate-500 font-medium"
                                                            />
                                                        </div>

                                                        <div>
                                                            <label className="block text-[10px] font-bold text-slate-600 uppercase">Motivo / Observação</label>
                                                            <input
                                                                type="text"
                                                                placeholder="Ex: Estoque insuficiente"
                                                                value={it.motivo || ''}
                                                                onChange={(e) => handleAnalyzeItem(selectedOrder.id, it.produtoId, approvedVal, deniedVal, e.target.value)}
                                                                className="w-full mt-1 p-2 bg-white border border-slate-300 rounded-lg text-slate-800"
                                                            />
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    {selectedOrder.status !== 'pronto_separacao' && (
                                        <div className="pt-4 flex justify-end">
                                            <button
                                                onClick={() => handleFinalizeAnalysis(selectedOrder.id)}
                                                className="px-5 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow-md transition flex items-center"
                                            >
                                                <i data-lucide="check" className="w-4 h-4 mr-2"></i>
                                                Finalizar Análise & Enviar para Separação Física
                                            </button>
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <div className="text-center py-12 text-slate-400">
                                    <i data-lucide="inbox" className="w-12 h-12 mx-auto mb-2 opacity-50"></i>
                                    <p className="text-xs">Selecione um pedido ao lado para iniciar a análise.</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function InventoryCyclesView({ cycles, setCycles, products, lotes, setLotes, currentUser, directUpdateAllowed, setDirectUpdateAllowed, logActivity, showToast }) {
            const [selectedCycle, setSelectedCycle] = useState(cycles[0] || null);

            const handleApproveCycleDivergence = (cycleId) => {
                // Apply differences to stock
                const targetCyc = cycles.find(c => c.id === cycleId);
                if (!targetCyc) return;

                targetCyc.itens.forEach(item => {
                    const targetLote = lotes.find(l => l.produtoId === item.produtoId && l.lote === item.lote);
                    if (targetLote) {
                        setLotes(prev => prev.map(l => l.id === targetLote.id ? { ...l, quantidade: item.qtdEncontrada } : l));
                    }
                });

                setCycles(prev => prev.map(c => c.id === cycleId ? { ...c, status: 'CONCLUIDO' } : c));
                logActivity(`Aprovação de Ajuste Inventário Ciclo ${cycleId}`, 'Múltiplos Produtos', 0, 'Almoxarifado Central');
                showToast(`Atualização do ciclo ${cycleId} aprovada e estoque oficial ajustado!`);
            };

            return (
                <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h2 className="text-xl font-bold text-slate-900">Atualização do Almoxarifado (Ciclos de Contagem Física)</h2>
                            <p className="text-xs text-slate-500">Conferência periódica de estoque e aprovação de divergências pela coordenação.</p>
                        </div>

                        {/* Direct Update Permission Switch for Coordinator */}
                        {(currentUser.role === 'ADMIN' || currentUser.role === 'COORDENADORA') && (
                            <div className="bg-white p-3 rounded-xl border border-slate-200/80 shadow-sm flex items-center space-x-3 text-xs">
                                <span className="font-bold text-slate-700">Alteração Direta pela Organização:</span>
                                <button
                                    onClick={() => {
                                        setDirectUpdateAllowed(!directUpdateAllowed);
                                        showToast(`Permissão de alteração direta alterada para: ${!directUpdateAllowed ? 'PERMITIDO' : 'BLOQUEADO'}`);
                                    }}
                                    className={`px-3 py-1 rounded-lg font-bold text-[10px] transition ${
                                        directUpdateAllowed ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-red-100 text-red-800 border border-red-300'
                                    }`}
                                >
                                    {directUpdateAllowed ? 'PERMITIDO' : 'BLOQUEADO (Requer Aprovação)'}
                                </button>
                            </div>
                        )}
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* CYCLES LIST */}
                        <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                            <h3 className="font-bold text-slate-800 text-xs uppercase tracking-wider mb-2">Ciclos de Atualização</h3>
                            {cycles.map(c => (
                                <div
                                    key={c.id}
                                    onClick={() => setSelectedCycle(c)}
                                    className={`p-3.5 rounded-xl border cursor-pointer transition text-xs ${selectedCycle?.id === c.id ? 'border-sky-500 bg-sky-50/50 shadow-sm' : 'border-slate-200 hover:bg-slate-50'}`}
                                >
                                    <div className="flex justify-between items-center font-bold">
                                        <span className="text-slate-900">{c.titulo}</span>
                                    </div>
                                    <div className="text-slate-500 mt-1">Responsável: {c.responsavel}</div>
                                    <div className="flex justify-between items-center mt-2">
                                        <span className="text-[10px] text-slate-400">Limite: {c.dataLimite}</span>
                                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                            c.status === 'CONCLUIDO' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                                        }`}>
                                            {c.status}
                                        </span>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* CYCLE DETAILS AND DIVERGENCES */}
                        <div className="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
                            {selectedCycle ? (
                                <div className="space-y-6 text-xs">
                                    <div className="flex justify-between items-start border-b border-slate-200 pb-4">
                                        <div>
                                            <span className="font-bold text-sky-600 uppercase tracking-wider text-[10px]">Ciclo #{selectedCycle.id}</span>
                                            <h3 className="text-base font-bold text-slate-900">{selectedCycle.titulo}</h3>
                                            <p className="text-slate-500 mt-0.5">{selectedCycle.observacao}</p>
                                        </div>
                                        <span className="px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800">
                                            Status: {selectedCycle.status}
                                        </span>
                                    </div>

                                    <div className="space-y-3">
                                        <h4 className="font-bold text-slate-800 uppercase tracking-wider text-[11px]">Itens Conferidos na Prateleira</h4>
                                        {selectedCycle.itens.map((it, idx) => (
                                            <div key={idx} className="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                                                <div className="flex justify-between items-center font-bold">
                                                    <span className="text-slate-900">{it.produtoNome} (Lote: {it.lote})</span>
                                                    <span className={it.diferenca < 0 ? 'text-red-600 font-bold' : 'text-emerald-600 font-bold'}>
                                                        Diferença: {it.diferenca} un.
                                                    </span>
                                                </div>
                                                <div className="grid grid-cols-3 gap-2 text-[11px] text-slate-600">
                                                    <div>Qtd. Sistema: <span className="font-bold">{it.qtdSistema}</span></div>
                                                    <div>Qtd. Encontrada: <span className="font-bold text-slate-900">{it.qtdEncontrada}</span></div>
                                                    <div>Validade: <span>{it.validade}</span></div>
                                                </div>
                                                {it.obs && <div className="text-[10px] text-slate-500 italic bg-white p-2 rounded border border-slate-200">Obs: {it.obs}</div>}
                                            </div>
                                        ))}
                                    </div>

                                    {selectedCycle.status !== 'CONCLUIDO' && (currentUser.role === 'ADMIN' || currentUser.role === 'COORDENADORA') && (
                                        <div className="pt-4 border-t border-slate-200 flex justify-end">
                                            <button
                                                onClick={() => handleApproveCycleDivergence(selectedCycle.id)}
                                                className="px-5 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow-md transition flex items-center"
                                            >
                                                <i data-lucide="check-circle" className="w-4 h-4 mr-2"></i>
                                                Aprovar Relatório de Contagem e Ajustar Estoque Oficial
                                            </button>
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <div className="text-center py-12 text-slate-400">
                                    <i data-lucide="clipboard" className="w-12 h-12 mx-auto mb-2 opacity-50"></i>
                                    <p className="text-xs">Selecione um ciclo de atualização para conferir os dados.</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function DonationsView({ donations, setDonations, products, lotes, setLotes, currentUser, logActivity, showToast }) {
            const [showModal, setShowModal] = useState(false);
            const [tipo, setTipo] = useState('RECEBIDA');
            const [prodNome, setProdNome] = useState('');
            const [qtd, setQtd] = useState('');
            const [lote, setLote] = useState('');
            const [validade, setValidade] = useState('');
            const [origemDestino, setOrigemDestino] = useState('');
            const [doc, setDoc] = useState('');

            const handleSaveDonation = (e) => {
                e.preventDefault();
                const newDon = {
                    id: 'don-' + Date.now(),
                    tipo,
                    produtoNome: prodNome,
                    quantidade: parseInt(qtd, 10),
                    lote,
                    validade,
                    origemDestino,
                    data: new Date().toISOString().split('T')[0],
                    documento: doc,
                    responsavel: currentUser.login
                };

                setDonations(prev => [newDon, ...prev]);
                logActivity(`Registro de Doação (${tipo})`, prodNome, qtd, origemDestino);
                showToast('Doação registrada com sucesso no histórico oficial.');

                setShowModal(false);
                setProdNome('');
                setQtd('');
                setLote('');
                setValidade('');
                setOrigemDestino('');
                setDoc('');
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-xl font-bold text-slate-900">Gestão de Doações Recebidas e Realizadas</h2>
                            <p className="text-xs text-slate-500">Rastreabilidade completa e emissão de comprovantes de doação pública.</p>
                        </div>
                        <button
                            onClick={() => setShowModal(true)}
                            className="px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-xl font-semibold text-xs shadow-sm transition flex items-center"
                        >
                            <i data-lucide="plus-circle" className="w-4 h-4 mr-2"></i>
                            Registrar Nova Doação
                        </button>
                    </div>

                    <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                        <table className="w-full text-left text-xs text-slate-700">
                            <thead className="bg-slate-50 border-b border-slate-200 font-bold uppercase tracking-wider text-slate-500">
                                <tr>
                                    <th className="p-4">Tipo</th>
                                    <th className="p-4">Produto</th>
                                    <th className="p-4">Qtd / Lote</th>
                                    <th className="p-4">Origem / Destino</th>
                                    <th className="p-4">Documento / Data</th>
                                    <th className="p-4 text-right">Responsável</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {donations.map(d => (
                                    <tr key={d.id} className="hover:bg-slate-50 transition">
                                        <td className="p-4">
                                            <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                                                d.tipo === 'RECEBIDA' ? 'bg-emerald-100 text-emerald-800' : 'bg-purple-100 text-purple-800'
                                            }`}>
                                                {d.tipo}
                                            </span>
                                        </td>
                                        <td className="p-4 font-bold text-slate-900">{d.produtoNome}</td>
                                        <td className="p-4 font-semibold text-slate-800">
                                            {d.quantidade} un.
                                            <span className="block text-[10px] text-slate-400 font-mono">Lote: {d.lote}</span>
                                        </td>
                                        <td className="p-4 text-slate-600 font-medium">{d.origemDestino}</td>
                                        <td className="p-4 text-slate-500">
                                            <div>{d.documento}</div>
                                            <div className="text-[10px] text-slate-400">{d.data}</div>
                                        </td>
                                        <td className="p-4 text-right font-mono text-slate-600">{d.responsavel}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {/* MODAL NEW DONATION */}
                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-bold text-slate-900 text-base">Registrar Nova Doação</h3>
                                    <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>
                                <form onSubmit={handleSaveDonation} className="space-y-4 text-xs">
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">Tipo de Doação</label>
                                        <select
                                            value={tipo}
                                            onChange={(e) => setTipo(e.target.value)}
                                            className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold"
                                        >
                                            <option value="RECEBIDA">RECEBIDA (Entrada de Material)</option>
                                            <option value="REALIZADA">REALIZADA (Saída para Terceiros/Entidades)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">Nome do Produto</label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="Ex: Luva de Procedimento"
                                            value={prodNome}
                                            onChange={(e) => setProdNome(e.target.value)}
                                            className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">Quantidade</label>
                                            <input
                                                type="number"
                                                min="1"
                                                required
                                                value={qtd}
                                                onChange={(e) => setQtd(e.target.value)}
                                                className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                            />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">Lote</label>
                                            <input
                                                type="text"
                                                required
                                                placeholder="LOTE-123"
                                                value={lote}
                                                onChange={(e) => setLote(e.target.value)}
                                                className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono"
                                            />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">Validade</label>
                                            <input
                                                type="date"
                                                required
                                                value={validade}
                                                onChange={(e) => setValidade(e.target.value)}
                                                className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                            />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">Documento / Ofício</label>
                                            <input
                                                type="text"
                                                placeholder="Ofício 100/2026"
                                                value={doc}
                                                onChange={(e) => setDoc(e.target.value)}
                                                className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">Origem ou Destino</label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="Ex: Entidade Doadora / Instituição Recebedora"
                                            value={origemDestino}
                                            onChange={(e) => setOrigemDestino(e.target.value)}
                                            className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                        />
                                    </div>

                                    <div className="pt-4 flex justify-end space-x-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowModal(false)}
                                            className="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl font-semibold hover:bg-slate-200"
                                        >
                                            Cancelar
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-4 py-2 bg-sky-600 text-white rounded-xl font-semibold hover:bg-sky-700"
                                        >
                                            Salvar Doação
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function UserManagementView({ users, setUsers, showToast }) {
            const [showModal, setShowModal] = useState(false);
            const [nome, setNome] = useState('');
            const [cargo, setCargo] = useState('coordenadora');
            const [descCargo, setDescCargo] = useState('');
            const [role, setRole] = useState('COORDENADORA');

            const handleCreateUser = (e) => {
                e.preventDefault();
                const cleanNome = nome.trim().toLowerCase();
                const cleanCargo = cargo.trim().toLowerCase();
                const generatedLogin = `${cleanNome}.${cleanCargo}`;

                if (users.some(u => u.login === generatedLogin)) {
                    alert('Este login (nome.cargo) já existe no sistema.');
                    return;
                }

                const newUser = {
                    id: 'u-' + Date.now(),
                    login: generatedLogin,
                    nome: cleanNome,
                    cargo: cleanCargo,
                    descCargo: descCargo || 'Funcionária Pública',
                    role,
                    senhaHash: 'demo123',
                    status: 'Ativo'
                };

                setUsers(prev => [...prev, newUser]);
                showToast(`Usuário ${generatedLogin} cadastrado com sucesso!`);

                setShowModal(false);
                setNome('');
                setCargo('coordenadora');
                setDescCargo('');
            };
