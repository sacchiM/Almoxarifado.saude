                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-xl font-bold text-slate-900">Gestão de Usuários & Permissões</h2>
                            <p className="text-xs text-slate-500">Controle de acessos individuais no formato padrão obrigatorio nome.cargo.</p>

                            onClick={() => setShowModal(true)}
                            className="px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-xl font-semibold text-xs shadow-sm transition flex items-center"
                        >

                        </button>

                            <thead className="bg-slate-50 border-b border-slate-200 font-bold uppercase tracking-wider text-slate-500">
                                <tr>
                                    <th className="p-4">Login (nome.cargo)</th>
                                    <th className="p-4">Nome</th>
                                    <th className="p-4">Cargo / Função</th>
                                    <th className="p-4">Perfil / Role</th>
                                    <th className="p-4 text-right">Status</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">

                                    <tr key={u.id} className="hover:bg-slate-50 transition">

                                        <td className="p-4 capitalize font-semibold text-slate-900">{u.nome}</td>
                                        <td className="p-4 text-slate-600">{u.descCargo}</td>
                                        <td className="p-4">
                                            <span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-slate-100 text-slate-800 border border-slate-200">
                                                {u.role}
                                            </span>
                                        </td>
                                        <td className="p-4 text-right">
                                            <span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">
                                                {u.status}
                                            </span>
                                        </td>
                                    </tr>
                                ))}

                        </table>

                    {showModal && (

                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">

                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>

                                <form onSubmit={handleCreateUser} className="space-y-4 text-xs">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">Nome (apenas primeiro nome)</label>
                                            <input
                                                type="text"
                                                required
                                                placeholder="ex: juliana"
                                                value={nome}
                                                onChange={(e) => setNome(e.target.value)}
                                                className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono text-slate-800"
                                            />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">Cargo (Sufixo do Login)</label>
                                            <input
                                                type="text"
                                                required
                                                placeholder="ex: coordenadora"
                                                value={cargo}
                                                onChange={(e) => setCargo(e.target.value)}
                                                className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono text-slate-800"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">Preview do Login Gerado</label>
                                        <div className="p-2.5 bg-slate-100 rounded-xl font-mono font-bold text-sky-700 text-sm">
                                            {nome.trim().toLowerCase() || 'nome'}.{cargo.trim().toLowerCase() || 'cargo'}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">Descrição Exibida do Cargo</label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="Ex: Coordenadora do Almoxarifado"
                                            value={descCargo}
                                            onChange={(e) => setDescCargo(e.target.value)}
                                            className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                                        />
                                    </div>

                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">Perfil de Permissões (Role)</label>
                                        <select
                                            value={role}
                                            onChange={(e) => setRole(e.target.value)}
                                            className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold"
                                        >
                                            <option value="ADMIN">ADMINISTRADOR</option>
                                            <option value="COORDENADORA">COORDENADORA DO ALMOXARIFADO</option>
                                            <option value="ORGANIZACAO">RESPONSÁVEL PELA ORGANIZAÇÃO</option>
                                            <option value="ANALISTA_PEDIDOS">RESPONSÁVEL PELA ANÁLISE DE PEDIDOS</option>
                                        </select>
                                    </div>

                                    <div className="pt-4 flex justify-end space-x-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowModal(false)}
                                            className="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl font-semibold hover:bg-slate-200"
                                        >
                                            Cancelar
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-4 py-2 bg-sky-600 text-white rounded-xl font-semibold hover:bg-sky-700"
                                        >
                                            Cadastrar Usuário
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function PrintableOrderSlip({ order }) {
            return (
                <div className="print-only p-8 bg-white text-black font-sans text-xs">
                    <div className="text-center border-b-2 border-black pb-4 mb-6">
                        <h1 className="text-xl font-bold uppercase">PREFEITURA MUNICIPAL</h1>
                        <h2 className="text-base font-bold uppercase">SECRETARIA MUNICIPAL DE SAÚDE</h2>
                        <h3 className="text-sm font-semibold uppercase">ALMOXARIFADO CENTRAL DA SAÚDE</h3>
                        <p className="text-xs font-mono mt-1">ORDEM DE SEPARAÇÃO FÍSICA E EXPEDIÇÃO DE MATERIAIS</p>
                    </div>

                    <div className="grid grid-cols-2 gap-4 border border-black p-4 mb-6">
                        <div>
                            <div><strong>NÚMERO DO PEDIDO:</strong> {order.id}</div>
                            <div><strong>UNIDADE SOLICITANTE:</strong> {order.unidadeNome}</div>
                            <div><strong>SOLICITANTE:</strong> {order.solicitante}</div>
                        </div>
                        <div>
                            <div><strong>DATA DO PEDIDO:</strong> {new Date(order.dataCriacao).toLocaleDateString('pt-BR')}</div>
                            <div><strong>STATUS:</strong> APROVADO PARA SEPARAÇÃO</div>
                            <div><strong>OBSERVAÇÃO:</strong> {order.observacao || 'Nenhum'}</div>
                        </div>
                    </div>

                    <table className="w-full border-collapse border border-black mb-8 text-xs">
                        <thead>
                            <tr className="bg-slate-200">
                                <th className="border border-black p-2 text-left">PRODUTO / DESCRIÇÃO</th>
                                <th className="border border-black p-2 text-center">SOLICITADO</th>
                                <th className="border border-black p-2 text-center">APROVADO</th>
                                <th className="border border-black p-2 text-center">QTD. SEPARADA</th>
                                <th className="border border-black p-2 text-left">OBSERVAÇÕES / LOTE SEPARADO</th>
                            </tr>
                        </thead>
                        <tbody>
                            {order.itens.map(it => (
                                <tr key={it.produtoId}>
                                    <td className="border border-black p-2 font-bold">{it.produtoNome}</td>
                                    <td className="border border-black p-2 text-center">{it.solicitado}</td>
                                    <td className="border border-black p-2 text-center font-bold">{it.aprovado !== null ? it.aprovado : it.solicitado}</td>
                                    <td className="border border-black p-2 text-center">[ &nbsp; &nbsp; &nbsp; &nbsp; ]</td>
                                    <td className="border border-black p-2 text-slate-500">{it.motivo || ''}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>

                    <div className="grid grid-cols-2 gap-8 pt-12 border-t border-black">
                        <div className="text-center">
                            <div className="border-t border-black w-48 mx-auto mb-1"></div>
                            <div><strong>RESPONSÁVEL PELA SEPARAÇÃO</strong></div>
                            <div className="text-[10px] text-slate-500">Almoxarifado Central</div>
                        </div>

                        <div className="text-center">
                            <div className="border-t border-black w-48 mx-auto mb-1"></div>
                            <div><strong>RESPONSÁVEL PELO RECEBIMENTO</strong></div>
                            <div className="text-[10px] text-slate-500">{order.unidadeNome}</div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
